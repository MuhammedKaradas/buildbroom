name: CI

# Lint the scripts and run the safety tests: Windows (PowerShell 5.1 and 7) and macOS (bash 3.2 and 5).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = @("windows", "tests") | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error }
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Safety test
        run: ./tests/safety.ps1

      - name: Dry run (caches)
        run: ./windows/buildbroom.ps1 -Mode caches

  # Lint the unix script and run its safety test on the macOS default bash 3.2 and on bash 5.
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bash: [/bin/bash, bash5]
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          if [ "${{ matrix.bash }}" = bash5 ]; then
            brew list bash >/dev/null 2>&1 || brew install bash
            echo "BB_BASH=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"
          else
            echo "BB_BASH=/bin/bash" >> "$GITHUB_ENV"
          fi

      - name: ShellCheck
        run: shellcheck -x unix/buildbroom.sh tests/safety.sh

      - name: Safety test
        run: |
          "$BB_BASH" --version | head -1
          "$BB_BASH" tests/safety.sh

      - name: Dry run (caches)
        run: '"$BB_BASH" unix/buildbroom.sh --mode caches'
