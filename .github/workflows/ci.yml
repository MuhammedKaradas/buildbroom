name: CI

# Lint the script and run the safety test on Windows PowerShell 5.1 and PowerShell 7.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path windows, tests -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Safety test
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/safety.ps1

      - name: Dry run (caches)
        run: .\buildbroom.cmd -Mode caches
